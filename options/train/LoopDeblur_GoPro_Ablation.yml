# LoopDeblur -- ablation grid of Table 3 on GoPro, plus the efficiency protocol.
#
# Table 3 cells (all at K=5, 1.46 M params unless noted):
#   (a) Fixed uniform routing (alpha=1/K, rho=1)     33.87  (-0.80)
#   (b) Single-module gating (K=1)                   27.06  (-7.61)
#   (c) w/o entropy regularisation (nu=0)            34.31  (-0.36)
#   (d) w/o continuation penalty (mu=0)              34.38  (-0.29)
#   (e) w/o deep supervision (lambda=0)              32.86  (-1.81)
#   (f) w/o input injection (autonomous loop)        28.42  (-6.25)
#   (g) w/o residual decoding (direct regression)    33.68  (-0.99)
#   (h) Top-1 hard routing (inference)               34.19  (-0.48)
#   Full model                                       34.67    --
#
# Module library size K (Fig. 4):
#   K=1  0.29 M  27.06 dB | K=5  1.46 M  34.67 dB | K=8  2.32 M  33.72 dB

name: LoopDeblur_GoPro_Ablation
model_type: LoopDeblurModel
scale: 1
num_gpu: 1
manual_seed: 10

datasets:
  train:
    name: GoPro_Train
    type: PairedDeblurDataset
    io_backend:
      type: disk
    dataroot_gt: datasets/GoPro/train/sharp
    dataroot_lq: datasets/GoPro/train/blur
    gt_size: 256
    use_flip: true
    use_rot: true
    phase: train
    num_worker_per_gpu: 8
    batch_size_per_gpu: 8
  val:
    name: GoPro_Val
    type: PairedDeblurDataset
    io_backend:
      type: disk
    dataroot_gt: datasets/GoPro/test/sharp
    dataroot_lq: datasets/GoPro/test/blur
    gt_size: ~
    phase: val

network_g:
  type: LoopDeblur
  in_channels: 3
  dim: 48
  num_modules: 5
  blocks_per_module: 2
  num_heads: 4
  max_iters: 6
  threshold: 0.5
  hard_routing: true          # cell (h) sets this to false -> lossless soft mix
  rand_start: 0.3

# ---- cell selection via command line ----------------------------------------
# Full model (reference):
#   python train.py -opt options/train/LoopDeblur_GoPro_Ablation.yml
#
# (a) fixed uniform routing:
#   --force_yml network_g.threshold=0.0 train.loop_opt.mu=0.0 train.loop_opt.nu=0.0
#       network_g.rand_start=0.0 network_g.hard_routing=false
# (b) single-module library (K=1):
#   --force_yml network_g.num_modules=1 train.loop_opt.nu=0.0
# (c) w/o entropy regularisation:
#   --force_yml train.loop_opt.nu=0.0
# (d) w/o continuation penalty:
#   --force_yml train.loop_opt.mu=0.0
# (e) w/o deep supervision:
#   --force_yml train.loop_opt.lambda_ds=0.0
# (f) w/o input injection: set network_g.input_injection=false
# (g) w/o residual decoding: set network_g.residual_decode=false
# (h) soft mixture at inference:
#   --force_yml network_g.hard_routing=false
#
# Efficiency protocol (Sec. 3.3): fixed B=6 vs adaptive stopping.
#   fixed B=6 : --force_yml network_g.inference_budget=6
#   adaptive  : (leave inference_budget unset)
# Reported: 121.2 -> 74.8 GMACs, about -38%, at a cost of 0.14 dB.

path:
  pretrain_network_g: ~

train:
  ema_decay: 0.999
  optim_g:
    type: AdamW
    lr: !!float 2e-4
    weight_decay: !!float 1e-4
    betas: [0.9, 0.99]
  scheduler:
    type: MultiStepLR
    milestones: [150000, 250000, 320000, 360000]
    gamma: 0.5
  total_iter: 400000
  warmup_iter: 3000
  track_iters: 3
  warmup_iters: 3
  loop_opt:
    lambda_ds: 0.5
    mu: 0.001
    nu: 0.001
    criterion: l1
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
  val_freq: !!float 5e3
  save_checkpoint_freq: !!float 5e3

val:
  save_img: true
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true

dist_params:
  backend: nccl
  port: 29500
