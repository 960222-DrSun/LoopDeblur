# LoopDeblur -- evaluation on the four benchmarks of Table 1.
#
#   GoPro 34.67/0.9745 | HIDE 32.64/0.9590 | RealBlur-R 41.30/0.9818 | RealBlur-J 34.37/0.9460
#
# Usage:
#   python basicsr/test.py -opt options/test/LoopDeblur_GoPro.yml

name: LoopDeblur_GoPro_Test
model_type: LoopDeblurModel
scale: 1
num_gpu: 1
manual_seed: 10

datasets:
  test:
    name: GoPro
    type: PairedDeblurDataset
    io_backend:
      type: disk
    dataroot_gt: datasets/GoPro/test/sharp
    dataroot_lq: datasets/GoPro/test/blur
    gt_size: ~
    phase: test

network_g:
  type: LoopDeblur
  in_channels: 3
  dim: 48
  num_modules: 5
  blocks_per_module: 2
  num_heads: 4
  max_iters: 6
  threshold: 0.5
  hard_routing: true
  # inference_budget: 6   # uncomment to run the fixed B=6 efficiency baseline
                          # (121.2 GMACs) instead of adaptive stopping (74.8 GMACs)

path:
  pretrain_network_g: experiments/LoopDeblur_GoPro/models/net_g_latest.pth
  strict_load_g: true

val:
  save_img: true
  suffix: ~
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

dist_params:
  backend: nccl
  port: 29500
