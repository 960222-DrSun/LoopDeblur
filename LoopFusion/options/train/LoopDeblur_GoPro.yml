# LoopDeblur -- training on GoPro.
# Paper: Table 1, 1.46 M parameters, target 34.67 dB PSNR / 0.9745 SSIM
#        (best PSNR on 3 of 4 benchmarks, best SSIM on all 4).
#
# Usage:
#   python train.py -opt options/train/LoopDeblur_GoPro.yml

name: LoopDeblur_GoPro
model_type: LoopDeblurModel
scale: 1
num_gpu: 1
manual_seed: 10

datasets:
  train:
    name: GoPro_Train
    type: PairedDeblurDataset
    io_backend:
      type: disk
    dataroot_gt: datasets/GoPro/train/sharp
    dataroot_lq: datasets/GoPro/train/blur
    gt_size: 256
    use_flip: true
    use_rot: true
    phase: train
    num_worker_per_gpu: 8
    batch_size_per_gpu: 8
    dataset_enlarge_ratio: 1

  val:
    name: GoPro_Val
    type: PairedDeblurDataset
    io_backend:
      type: disk
    dataroot_gt: datasets/GoPro/test/sharp
    dataroot_lq: datasets/GoPro/test/blur
    gt_size: ~
    phase: val

network_g:
  type: LoopDeblur
  in_channels: 3
  dim: 48
  num_modules: 5          # K = 5 is the optimum: 1.46 M params, 34.67 dB
  blocks_per_module: 2    # M Restormer blocks per degradation module
  num_heads: 4
  max_iters: 6            # B_max: maximum computational budget
  threshold: 0.5          # eta: continuation threshold for adaptive stopping
  hard_routing: true      # top-1 routing at inference -> 1/K per-step cost
  rand_start: 0.3         # random truncation of the training forward pass

path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

train:
  ema_decay: 0.999
  optim_g:
    type: AdamW
    lr: !!float 2e-4
    weight_decay: !!float 1e-4
    betas: [0.9, 0.99]
  scheduler:
    type: MultiStepLR
    milestones: [150000, 250000, 320000, 360000]
    gamma: 0.5
  total_iter: 400000
  warmup_iter: 3000
  # ---- truncated BPTT window --------------------------------------------
  track_iters: 3          # T: iterations carrying gradient
  warmup_iters: 3         # B_max - T: forward-only warm-up iterations
  # ---- objective (Eq. 6 and Eq. 7) --------------------------------------
  loop_opt:
    lambda_ds: 0.5        # deep supervision weight (Eq. 6)
    mu: 0.001             # continuation penalty   (Eq. 7)
    nu: 0.001             # entropy regularisation (Eq. 7)
    criterion: l1
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
  val_freq: !!float 5e3
  save_checkpoint_freq: !!float 5e3

val:
  save_img: true
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true

dist_params:
  backend: nccl
  port: 29500
